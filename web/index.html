<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    if (window.location.hash) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    window.addEventListener('hashchange', function() {
      if (window.location.hash) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    });
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi Analisis Data Mining Algoritma Apriori Kelompok 4 - Universitas Gunadarma">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2E1065">

  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AprioriMart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AprioriMart - Data Mining Kelompok 4 (Universitas Gunadarma)</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="gunadarma_logo.png" as="image">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .flutter-loader,
    [class*="flutter-loader"],
    svg[class*="flutter"],
    #flutter-loader {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #ug-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }

    .ug-logo-wrap {
      width: 82px;
      height: 82px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #faf5ff;
      border: 1px solid #f3e8ff;
      box-shadow: 0 4px 16px rgba(46, 16, 101, 0.06);
    }

    .ug-logo-wrap img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .ug-title {
      font-size: 15px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.2px;
      margin-bottom: 4px;
      text-align: center;
    }

    .ug-subtitle {
      font-size: 11.5px;
      font-weight: 500;
      color: #8e8e93;
      letter-spacing: 0.1px;
      margin-bottom: 22px;
      text-align: center;
    }

    .ug-progress-bar {
      width: 130px;
      height: 3.5px;
      background: #e5e5ea;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .ug-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #5856d6, #2e1065);
      border-radius: 4px;
      animation: ugProgressGlide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes ugProgressGlide {
      0% {
        left: -45%;
        width: 30%;
      }
      50% {
        width: 60%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
  </style>
</head>
<body>
  <div id="ug-splash">
    <div class="ug-logo-wrap">
      <img src="gunadarma_logo.png" alt="Universitas Gunadarma">
    </div>
    <div class="ug-title">Data Mining • Kelompok 4</div>
    <div class="ug-subtitle">Universitas Gunadarma • 3KA31</div>
    <div class="ug-progress-bar">
      <div class="ug-progress-fill"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
